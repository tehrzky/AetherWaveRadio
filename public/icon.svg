<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b111e"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- App Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Radio Body -->
  <rect x="76" y="148" width="360" height="256" rx="36" fill="#182234" stroke="#ffffff" stroke-opacity="0.1" stroke-width="4"/>
  
  <!-- Antenna -->
  <line x1="130" y1="148" x2="220" y2="76" stroke="url(#accent)" stroke-width="8" stroke-linecap="round"/>
  <circle cx="220" cy="76" r="10" fill="#fbbf24" filter="url(#glow)"/>

  <!-- Speaker Grille / Soundwaves -->
  <circle cx="176" cy="276" r="68" fill="#0f172a" stroke="#ffffff" stroke-opacity="0.06" stroke-width="4"/>
  <circle cx="176" cy="276" r="48" fill="none" stroke="url(#accent)" stroke-width="6" stroke-opacity="0.8" stroke-dasharray="14 8"/>
  <circle cx="176" cy="276" r="24" fill="#fbbf24" opacity="0.9" filter="url(#glow)"/>

  <!-- Radio Tuner Screen -->
  <rect x="276" y="196" width="128" height="64" rx="12" fill="#090d16" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.4"/>
  <line x1="290" y1="228" x2="390" y2="228" stroke="#334155" stroke-width="3"/>
  <line x1="340" y1="210" x2="340" y2="246" stroke="#fbbf24" stroke-width="4" stroke-linecap="round"/>

  <!-- Control Knobs -->
  <circle cx="310" cy="316" r="22" fill="#243147" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <circle cx="310" cy="316" r="6" fill="#fbbf24"/>

  <circle cx="372" cy="316" r="22" fill="#243147" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>
  <circle cx="372" cy="316" r="6" fill="#fbbf24"/>

  <!-- Indicator Light -->
  <circle cx="112" cy="180" r="7" fill="#10b981" filter="url(#glow)"/>
</svg>
