name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK (Capacitor)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install dependencies
        run: bun install

      - name: Build web app
        run: bun run build

      - name: Verify dist output
        run: ls -la dist/

      - name: Install Capacitor
        run: |
          bun add -d @capacitor/cli@latest
          bun add @capacitor/core@latest @capacitor/android@latest

      - name: Write Capacitor config
        run: |
          cat > capacitor.config.json << 'EOF'
          {
            "appId": "com.aetherwave.radio",
            "appName": "AetherWave Radio",
            "webDir": "dist",
            "bundledWebRuntime": false
          }
          EOF

      - name: Add Android platform
        run: bunx cap add android

      - name: Sync web assets into Android
        run: bunx cap sync android

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aetherwave-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
